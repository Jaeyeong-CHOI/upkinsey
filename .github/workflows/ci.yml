name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      PYTHONPATH: src
      UPSTAGE_API_KEY: ""
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run offline tests (no API keys or dataset installation)
        run: python -m unittest discover -s tests -p 'test*.py' -v
      - name: Compile all Python entry points
        run: python -m compileall -q src scripts tests

  frontend:
    name: Frontend regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install locked build dependencies
        run: npm ci --no-audit --no-fund
      - name: Build production browser assets
        run: npm run build
      - name: Run frontend regression tests
        run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the deployment image (no inference or publication)
        run: docker build --tag upkinsey:ci .
      - name: Start the image with fixture credentials and no API key
        id: start_container
        run: |
          docker run --detach --name upkinsey-ci-smoke \
            --publish 127.0.0.1:15173:5173 \
            --env UPKINSEY_HOST=0.0.0.0 \
            --env PORT=5173 \
            --env UPSTAGE_API_KEY= \
            --env HF_HUB_OFFLINE=1 \
            --env HF_DATASETS_OFFLINE=1 \
            --env UPKINSEY_REQUIRE_BASIC_AUTH=1 \
            --env UPKINSEY_BASIC_AUTH_USER=ci-operator \
            --env UPKINSEY_BASIC_AUTH_PASSWORD=ci-only-password-not-a-secret \
            upkinsey:ci
      - name: Verify container health, authentication, and browser assets
        run: |
          python3 - <<'PY'
          import base64
          import json
          import re
          import time
          import urllib.error
          import urllib.request

          base_url = "http://127.0.0.1:15173"

          class NoRedirects(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          # Never route this local-only smoke test through a proxy or redirect.
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirects())

          def request(path, *, method="GET", authenticated=False, timeout=2):
              headers = {}
              if authenticated:
                  # Public, disposable test fixtures, not deployment credentials.
                  token = base64.b64encode(b"ci-operator:ci-only-password-not-a-secret").decode("ascii")
                  headers["Authorization"] = f"Basic {token}"
              req = urllib.request.Request(base_url + path, headers=headers, method=method)
              try:
                  response = opener.open(req, timeout=timeout)
              except urllib.error.HTTPError as exc:
                  response = exc
              with response:
                  return response.status, response.headers, response.read()

          deadline = time.monotonic() + 30
          while True:
              remaining = deadline - time.monotonic()
              if remaining <= 0:
                  raise SystemExit("Container did not become ready within 30 seconds")
              try:
                  status, _, body = request("/api/health", timeout=min(2, remaining))
                  break
              except OSError:
                  time.sleep(min(0.25, max(0, deadline - time.monotonic())))

          assert status == 200, f"Health status: {status}"
          health = json.loads(body)
          assert health["ok"] is False, "Smoke container must have no live API key"
          assert health["auth_required"] is True
          assert health["auth_configured"] is True

          for method in ("GET", "HEAD"):
              status, headers, body = request("/Resonance.html", method=method)
              assert status == 401, f"Unauthenticated {method}: {status}"
              assert headers.get("WWW-Authenticate", "").startswith("Basic ")
              if method == "HEAD":
                  assert body == b"", "HEAD must not send a response body"

          for page in ("/", "/Resonance.html"):
              status, headers, body = request(page, authenticated=True)
              assert status == 200, f"Authenticated {page}: {status}"
              assert headers.get("Cache-Control") == "no-cache"
              assert "script-src 'self'" in headers.get("Content-Security-Policy", "")
              html = body.decode("utf-8")
              assert "text/babel" not in html and "unpkg.com" not in html
              assets = re.findall(r'(?:src|href)="(assets/[^\"]+\.(?:js|css))"', html)
              assert len(assets) == 2, f"Expected local JS/CSS: {assets}"
              for asset in assets:
                  status, headers, data = request("/" + asset, authenticated=True)
                  assert status == 200 and data, f"Missing {asset}"
                  assert "immutable" in headers.get("Cache-Control", "")
                  if asset.startswith("assets/app-") and asset.endswith(".js"):
                      status, _, license_text = request("/" + asset + ".LEGAL.txt", authenticated=True)
                      assert status == 200 and b"MIT" in license_text
          for authenticated, expected in ((False, 401), (True, 200)):
              assert request("/api/graph/summary", authenticated=authenticated)[0] == expected
          print("Container smoke passed: no-key health, GET/HEAD auth, graph access, production assets and CSP")
          PY
      - name: Verify non-root runtime and writable data directory
        run: |
          test "$(docker exec upkinsey-ci-smoke id -u)" = 10001
          test "$(docker exec upkinsey-ci-smoke id -g)" = 10001
          docker exec upkinsey-ci-smoke python -c "from pathlib import Path; p=Path('/app/data/.ci-write-probe'); p.write_text('ok')"
      - name: Show container logs on failure
        if: failure() && steps.start_container.outcome == 'success'
        run: docker logs upkinsey-ci-smoke
      - name: Stop the smoke container
        if: always() && steps.start_container.outcome == 'success'
        run: docker stop --time 10 upkinsey-ci-smoke

  package:
    name: Build and install package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - name: Build source distribution and wheel
        run: |
          python -m pip install build
          python -m build --outdir "$RUNNER_TEMP/upkinsey-dist"
      - name: Install wheel into a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/upkinsey-wheel"
          "$RUNNER_TEMP/upkinsey-wheel/bin/python" -m pip install --no-deps "$RUNNER_TEMP"/upkinsey-dist/*.whl
          "$RUNNER_TEMP/upkinsey-wheel/bin/python" -I - <<'PY'
          import importlib
          from importlib.metadata import version

          for module in (
              "upstage_api_sim",
              "upstage_api_sim.document_parse",
              "upstage_api_sim.env",
              "upstage_api_sim.market_research",
              "upstage_api_sim.personas.io",
              "upstage_api_sim.personas.nemotron",
              "upstage_api_sim.personas.sampling",
              "upstage_api_sim.server",
              "upstage_api_sim.graph_store",
              "upstage_api_sim.provenance",
              "upstage_api_sim.research_inputs",
              "upstage_api_sim.report_markdown",
              "upstage_api_sim.interview_planning",
              "upstage_api_sim.run_store",
              "upstage_api_sim.upstage_client",
          ):
              importlib.import_module(module)
          from upstage_api_sim import __version__
          assert version("upstage-api-simulation") == __version__
          PY
          "$RUNNER_TEMP/upkinsey-wheel/bin/upkinsey" --version
          "$RUNNER_TEMP/upkinsey-wheel/bin/python" -I -m upstage_api_sim --help
